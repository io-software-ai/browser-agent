<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser Agent</title>
<style>
  :root {
    --bg: #f7f7f8; --surface: #ffffff; --surface-2: #f1f1f3;
    --fg: #16161a; --muted: #6b6b76; --faint: #9a9aa4;
    --line: #e6e6ea; --line-strong: #d6d6dc;
    --accent: #5b5bd6; --accent-fg: #ffffff; --accent-soft: #eeeefc;
    --ok: #1f9d55; --err: #d93036; --err-soft: #fdeeee;
    --shadow: 0 1px 2px rgba(16,16,24,.04), 0 2px 8px rgba(16,16,24,.04);
    --ring: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f11; --surface: #18181b; --surface-2: #202024;
      --fg: #ececf1; --muted: #9d9daa; --faint: #6c6c78;
      --line: #26262b; --line-strong: #34343b;
      --accent: #8b8bf5; --accent-fg: #0f0f11; --accent-soft: #23233a;
      --ok: #4ade80; --err: #f87171; --err-soft: #2a1718;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  #root { display: contents; } /* React 掛載點：讓 header／#onboard／#chat 仍是 body 的 flex 子項 */
  body {
    margin: 0; display: flex; flex-direction: column;
    font: 13.5px/1.6 "Inter", system-ui, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  body { overflow-wrap: anywhere; }
  button { cursor: pointer; }
  svg { width: 16px; height: 16px; flex: none; }
  :focus-visible { outline: none; box-shadow: var(--ring); }

  /* ---------- 頂列 ---------- */
  header {
    display: flex; align-items: center; justify-content: flex-end; gap: 8px; height: 48px; padding: 0 10px;
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .icon-btn {
    width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: 7px;
    border: 0; background: transparent; color: var(--muted);
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--fg); }

  /* ---------- 醒目揭露／首次設定 ---------- */
  #consent, #onboard { flex: 1; display: none; flex-direction: column; justify-content: center; padding: 24px 20px; gap: 18px; }
  body[data-view=consent] #consent { display: flex; }
  body[data-view=onboard] #onboard { display: flex; }
  body[data-view=consent] #chat, body[data-view=consent] header,
  body[data-view=onboard] #chat, body[data-view=onboard] header { display: none; }
  #consent h1, #onboard h1 { margin: 0; font-size: 20px; letter-spacing: -.02em; line-height: 1.3; }
  #consent p, #onboard p { margin: 0; color: var(--muted); }
  .consent-list { margin: 0; padding: 0 0 0 18px; display: grid; gap: 8px; color: var(--fg); }
  .msg.note { font-size: 12.5px; color: var(--muted); }
  .msg.stats { font-size: 11px; color: var(--faint); margin-top: -4px; }
  .msg.quota { display: grid; gap: 8px; justify-items: start; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--accent-soft); font-size: 13px; }
  .msg.quota span { color: var(--muted); }
  .account { display: grid; gap: 6px; }
  .account .group-title { margin: 0; }
  .account-row .btn { flex: none; }
  .meter { width: 100%; height: 8px; margin: 6px 0 2px; appearance: none; border: 0; border-radius: 4px; overflow: hidden; background: var(--surface-2); }
  .meter::-webkit-progress-bar { background: var(--surface-2); }
  .meter::-webkit-progress-value { background: var(--accent); border-radius: 4px; }
  .meter[data-low]::-webkit-progress-value { background: #d64545; }
  /* 設定頁最下面、預設收合的「使用自己的 API Key（進階）」 */
  .advanced { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .advanced > summary { list-style: none; cursor: pointer; }
  .advanced > summary::-webkit-details-marker { display: none; }
  .advanced > summary svg { transition: transform .15s; }
  .advanced[open] > summary svg { transform: rotate(90deg); }
  .advanced[open] > summary { border-bottom: 1px solid var(--line); }
  .advanced-body { display: grid; gap: 12px; padding: 12px; }
  .advanced-body .byok-toggle { padding: 0; min-height: 0; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 16px; display: grid; gap: 10px; }
  .field-label { font-size: 12px; font-weight: 500; color: var(--muted); }
  .input {
    width: 100%; height: 36px; padding: 0 10px; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--line-strong);
  }
  .input:focus { border-color: var(--accent); box-shadow: var(--ring); outline: none; }
  .btn {
    height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid transparent;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 500;
  }
  .btn-primary { background: var(--accent); color: var(--accent-fg); }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-ghost { background: var(--surface); border-color: var(--line-strong); }
  .btn-ghost:hover { background: var(--surface-2); }
  .hint { font-size: 12px; color: var(--faint); }
  .hint a { color: var(--accent); text-decoration: none; }
  .form-error { font-size: 12px; color: var(--err); }
  .form-error:empty { display: none; }

  /* ---------- 對話 ---------- */
  #chat { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #scroll { flex: 1; overflow-y: auto; padding: 16px 14px 8px; }
  #log { display: flex; flex-direction: column; gap: 14px; }

  #empty { display: none; flex-direction: column; gap: 14px; padding: 28px 2px 0; }
  #chat:has(#log:empty) #empty { display: flex; }
  #empty h2 { margin: 0; font-size: 17px; letter-spacing: -.015em; }
  #empty p { margin: -8px 0 4px; color: var(--muted); }
  .suggest {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); box-shadow: var(--shadow); transition: border-color .15s;
  }
  .suggest:hover { border-color: var(--accent); }
  .suggest-list { display: grid; gap: 10px; transition: opacity .2s; }
  #empty[data-loading] #empty-sub { animation: pulse 1.4s ease-in-out infinite; }
  #empty[data-loading] .suggest-list { opacity: .55; }
  .suggest svg { color: var(--accent); }
  .suggest span { flex: 1; }
  .suggest small { display: block; color: var(--faint); font-size: 12px; }

  .msg { white-space: pre-wrap; word-break: break-word; }
  .user {
    align-self: flex-end; max-width: 88%; padding: 8px 12px; border-radius: 12px 12px 4px 12px;
    background: var(--accent); color: var(--accent-fg);
  }
  .assistant { padding: 0 2px; white-space: normal; }
  /* 使用者訊息附帶的頁面選取內容：摺疊的引用框 */
  .user-sel { margin-top: 6px; font-size: 12.5px; }
  .user-sel summary { cursor: pointer; opacity: .85; }
  .user-sel blockquote {
    margin: 4px 0 0; padding: 4px 0 4px 8px; border-left: 2px solid color-mix(in srgb, var(--accent-fg) 50%, transparent);
    max-height: 180px; overflow: auto; opacity: .9;
  }
  @keyframes pulse { 50% { opacity: .4; } }

  /* Markdown */
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol, .md pre, .md table, .md blockquote { margin: 0 0 10px; }
  .md h1, .md h2, .md h3, .md h4 { margin: 16px 0 6px; line-height: 1.35; letter-spacing: -.01em; }
  .md h1 { font-size: 17px; } .md h2 { font-size: 15.5px; } .md h3, .md h4 { font-size: 14px; }
  .md ul, .md ol { padding-left: 20px; }
  .md li { margin: 2px 0; }
  .md li::marker { color: var(--faint); }
  .md a { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
  .md a:hover { border-bottom-color: var(--accent); }
  /* 連結文字不是它真正前往的網域：後面小字標出真網域（data-host 由 log.tsx 的 DOMPurify hook 設） */
  .md a[data-host]::after { content: " (" attr(data-host) ")"; font-size: .78em; color: var(--muted); overflow-wrap: anywhere; }
  .md a.cite { border-bottom: 0; font-size: .82em; vertical-align: .12em; margin-left: 1px; }
  .sources { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12.5px; }
  .sources-title { color: var(--muted); font-weight: 500; margin-bottom: 4px; }
  .sources ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
  .sources li { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
  .sources a { color: var(--fg); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .sources a:hover { color: var(--accent); }
  .sources .cite-n { color: var(--accent); }
  .sources-host { color: var(--faint); font-size: 11.5px; flex: none; }
  .md strong { font-weight: 600; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  .md blockquote { padding: 2px 0 2px 12px; border-left: 3px solid var(--line-strong); color: var(--muted); }
  .md :not(pre) > code {
    font: 12px ui-monospace, "SF Mono", Menlo, monospace; padding: 1px 5px; border-radius: 5px;
    background: var(--surface-2); border: 1px solid var(--line);
  }
  .md pre {
    position: relative; padding: 10px 12px; border-radius: 8px; overflow-x: auto;
    background: var(--surface); border: 1px solid var(--line);
    font: 12px/1.55 ui-monospace, "SF Mono", Menlo, monospace;
  }
  .md pre .copy { position: absolute; top: 6px; right: 6px; opacity: 0; }
  .md pre:hover .copy { opacity: 1; }
  .md table { display: block; overflow-x: auto; border-collapse: collapse; font-size: 12.5px; }
  .md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; min-width: 4em; overflow-wrap: normal; }
  .md th { background: var(--surface-2); font-weight: 600; }
  .md img { max-width: 100%; border-radius: 6px; }

  .msg-actions { display: flex; gap: 2px; margin-top: 4px; opacity: 0; transition: opacity .15s; }
  .assistant:hover .msg-actions, .assistant:focus-within .msg-actions { opacity: 1; }
  .copy {
    display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 6px; border-radius: 6px;
    border: 0; background: transparent; color: var(--faint); font-size: 12px;
  }
  .md pre .copy { background: var(--surface-2); border: 1px solid var(--line); }
  .copy svg { width: 13px; height: 13px; }
  .copy:hover { background: var(--surface-2); color: var(--fg); }
  .copy.done { color: var(--ok); }
  .copy.done::after { content: attr(data-done); } /* 「已複製」由 React 依介面語言給字 */
  .msg-actions .copy.done { font-size: 0; }
  .msg-actions .copy.done::after { font-size: 12px; }

  /* 思考過程 */
  details.thinking { align-self: stretch; }
  details.thinking > summary {
    list-style: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    font-size: 12.5px; color: var(--muted); user-select: none;
  }
  details.thinking > summary::-webkit-details-marker { display: none; }
  details.thinking > summary::before {
    content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
    transform: rotate(-45deg); transition: transform .15s; margin-right: 2px;
  }
  details.thinking[open] > summary::before { transform: rotate(45deg); }
  details.thinking:has(> .md) > summary:hover { color: var(--fg); }
  details.thinking:not(:has(> .md)) > summary { cursor: default; }
  details.thinking:not(:has(> .md)) > summary::before { display: none; }
  details.thinking[data-state=running] > summary { animation: pulse 1.4s ease-in-out infinite; }
  details.thinking > .md {
    margin: 6px 0 0 3px; padding: 2px 0 2px 12px; border-left: 2px solid var(--line);
    color: var(--muted); font-size: 12.5px;
  }

  .pending { display: flex; gap: 4px; padding: 6px 2px; }
  .pending i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); animation: bounce 1.1s infinite ease-in-out; }
  .pending i:nth-child(2) { animation-delay: .15s; } .pending i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 80%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
  .error {
    padding: 8px 12px; border-radius: 10px; background: var(--err-soft); color: var(--err);
    border: 1px solid color-mix(in srgb, var(--err) 25%, transparent); font-size: 13px;
  }

  details.tool {
    align-self: flex-start; max-width: 100%; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); font-size: 12px;
  }
  details.tool > summary {
    list-style: none; display: flex; align-items: center; gap: 7px; padding: 4px 9px; cursor: pointer; color: var(--muted);
  }
  details.tool > summary::-webkit-details-marker { display: none; }
  details.tool .tool-label, details.tools .tool-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); }
  .tool-error { padding: 0 9px 6px 30px; color: var(--err); font-size: 12px; }
  details.tools > summary { flex-wrap: wrap; }
  details.tool > summary, details.tools > summary { min-height: 32px; }
  details.tools > summary .tool-error { flex-basis: 100%; padding: 0 0 0 21px; }
  details.tools {
    align-self: stretch; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 12px;
  }
  details.tools > summary {
    list-style: none; display: flex; align-items: center; gap: 7px; padding: 5px 9px; cursor: pointer; color: var(--muted);
  }
  details.tools > summary::-webkit-details-marker { display: none; }
  .tools-list { display: grid; gap: 4px; padding: 6px 8px 8px; border-top: 1px solid var(--line); }
  .tools-list details.tool { border-color: transparent; }
  .tools[data-state=running] .status::before {
    content: ""; width: 10px; height: 10px; border-radius: 50%;
    border: 1.5px solid var(--line-strong); border-top-color: var(--accent); animation: spin .7s linear infinite;
  }
  .tools[data-state=ok] .status { color: var(--ok); }
  .tools[data-state=error] .status { color: var(--err); }
  details.tool pre {
    margin: 0; padding: 8px 10px; border-top: 1px solid var(--line); background: var(--surface-2);
    font: 11.5px/1.5 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; word-break: break-all;
    max-height: 160px; overflow: auto; border-radius: 0 0 8px 8px;
  }
  .status { width: 14px; height: 14px; display: grid; place-items: center; }
  .status svg { width: 13px; height: 13px; }
  .tool[data-state=running] .status::before {
    content: ""; width: 10px; height: 10px; border-radius: 50%;
    border: 1.5px solid var(--line-strong); border-top-color: var(--accent); animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(1turn); } }
  .tool[data-state=ok] .status { color: var(--ok); }
  .tool[data-state=error] .status { color: var(--err); }
  .tool[data-state=error], .tools[data-state=error] { border-color: color-mix(in srgb, var(--err) 30%, transparent); }

  /* ---------- 輸入框 ---------- */
  form { padding: 8px 12px 12px; }
  .composer {
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px;
    box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s;
  }
  .composer:focus-within { border-color: var(--accent); box-shadow: var(--ring); }
  textarea {
    display: block; width: 100%; border: 0; background: transparent; resize: none; outline: none;
    padding: 10px 12px 4px; field-sizing: content; min-height: 44px; max-height: 180px;
  }
  textarea::placeholder { color: var(--faint); }
  textarea:focus-visible { box-shadow: none; }
  .composer-bar { display: flex; align-items: center; gap: 6px; padding: 4px 6px 6px 8px; min-width: 0; }
  /* 輸入框上方：頁面選取內容的標籤、PDF 的「在檢視器開啟」 */
  .selection-chip {
    display: flex; align-items: center; gap: 4px; max-width: 100%; min-height: 28px; margin: 0 0 6px; padding: 2px 4px 2px 10px;
    border: 1px solid var(--line-strong); border-radius: 8px; background: var(--accent-soft); color: var(--fg); font-size: 12.5px;
  }
  .selection-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .selection-remove { flex: none; width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 16px; line-height: 1; }
  .selection-remove:hover { background: var(--surface-2); color: var(--fg); }
  .pdf-open { padding-right: 10px; color: var(--accent); font-weight: 500; }
  .pdf-open:hover { border-color: var(--accent); }
  /* ---------- 自訂下拉選單（select.tsx） ---------- */
  .sel { min-width: 0; }
  .sel[hidden] { display: none; }
  .sel-btn {
    display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 32px; min-width: 0;
    border: 1px solid transparent; border-radius: 8px; background: transparent; text-align: left; cursor: pointer;
  }
  .sel-btn::after { /* 向下的小箭頭 */
    content: ""; flex: none; width: 5px; height: 5px; margin: -3px 2px 0 auto;
    border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); opacity: .7;
    transition: transform .15s;
  }
  .sel[data-open] .sel-btn::after { transform: translateY(3px) rotate(-135deg); }
  .sel-value { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sel-btn[data-empty] .sel-value { color: var(--faint); }
  /* 輸入框下方：小字、無框 */
  .sel-bar { flex: 0 1 auto; max-width: 48%; }
  .sel-bar .sel-btn { color: var(--muted); font-size: 12px; font-weight: 500; padding: 0 6px 0 8px; }
  .sel-bar .sel-btn:hover, .sel-bar[data-open] .sel-btn { background: var(--surface-2); color: var(--fg); }
  .sel-bar .sel-btn[data-empty] { color: var(--accent); }
  .sel-bar .sel-btn[data-empty] .sel-value { color: inherit; }
  /* 跟 .input 同一套外觀 */
  .sel-field .sel-btn, .sel-compact .sel-btn { background: var(--surface); border-color: var(--line-strong); padding: 0 10px; }
  .sel-field .sel-btn { width: 100%; height: 36px; }
  .sel-compact { flex: 0 1 auto; max-width: 100%; }
  .sel-compact .sel-btn { font-size: 12.5px; padding: 0 8px; }
  .sel-field .sel-btn:hover, .sel-compact .sel-btn:hover { border-color: var(--faint); }
  .sel-field[data-open] .sel-btn, .sel-compact[data-open] .sel-btn { border-color: var(--accent); box-shadow: var(--ring); }
  .sel-pop {
    position: fixed; z-index: 40; display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.14);
    font-size: 13px; animation: sel-in .12s ease-out;
  }
  .sel-pop[data-up] { animation-name: sel-in-up; }
  @keyframes sel-in { from { opacity: 0; transform: translateY(-4px); } }
  @keyframes sel-in-up { from { opacity: 0; transform: translateY(4px); } }
  @media (prefers-reduced-motion: reduce) { .sel-pop { animation: none; } }
  .sel-search {
    flex: none; height: 36px; margin: 4px 4px 0; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 7px;
    background: var(--surface); outline: none; min-width: 0;
  }
  .sel-search:focus { border-color: var(--accent); box-shadow: var(--ring); }
  .sel-status { flex: none; padding: 6px 10px 2px; font-size: 12px; color: var(--muted); }
  .sel-list { position: relative; flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px; outline: none; }
  .sel-list:focus-visible { box-shadow: none; }
  .sel-opt { display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 5px 8px 5px 10px; border-radius: 7px; cursor: pointer; }
  .sel-opt[data-active] { background: var(--surface-2); }
  .sel-list:focus-visible .sel-opt[data-active], .sel-pop:has(.sel-search:focus-visible) .sel-opt[data-active] { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 45%, transparent); }
  .sel-opt[aria-selected=true] .sel-label { color: var(--accent); font-weight: 600; }
  .sel-opt svg { width: 14px; height: 14px; color: var(--accent); }
  .sel-text { flex: 1; min-width: 0; display: grid; }
  .sel-label, .sel-text small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sel-text small { color: var(--faint); font-size: 11.5px; line-height: 1.4; }
  /* 輸入框下方的模型選單：說明（含「N 點／任務」）太長就換行，不截斷 */
  #model-list .sel-text small { white-space: normal; }
  /* 鎖住的項目（方案不夠）：標籤變淡、鎖頭、「需升級方案」用強調色 */
  .sel-opt[data-locked] .sel-label { color: var(--muted); }
  .sel-opt[data-locked] svg { color: var(--faint); }
  .sel-text small.sel-lock { color: var(--accent); font-weight: 500; }
  .sel-empty { padding: 8px 10px; color: var(--faint); font-size: 12px; }
  .spacer { flex: 1; }
  #send {
    width: 32px; height: 32px; flex: none; border-radius: 8px; border: 0; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-fg);
  }
  #send:hover { filter: brightness(1.06); }
  #send .i-stop, #send[data-stop] .i-send { display: none; }
  #send[data-stop] .i-stop { display: block; }
  #send[data-stop] { background: var(--fg); color: var(--bg); }
  .kbd-hint { font-size: 11px; color: var(--faint); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 340px) { .kbd-hint { display: none; } }

  /* ---------- 整頁畫面：設定、歷史、技能編輯 ---------- */
  .page {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; background: var(--bg);
  }
  .page-head {
    flex: none; display: flex; align-items: center; gap: 4px; min-height: 48px; padding: 0 12px 0 6px;
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .page-head h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -.01em; min-width: 0; line-height: 1.3; }
  .page-body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 14px 20px; display: flex; flex-direction: column; gap: 14px; }
  .page-body > * { flex-shrink: 0; } /* 內容比畫面長時由 page-body 捲動，子項不要被壓扁 */
  .page form { padding: 0; }
  .page-foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); }
  .page-note { margin-top: auto; text-align: center; padding-top: 6px; }
  .row { display: grid; gap: 6px; }
  .key-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .key-row .input { flex: 1 1 12em; min-width: 0; }
  #key { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
  .danger { color: var(--err); }
  .btn { min-width: 0; text-align: center; line-height: 1.25; }
  .btn.wide { width: 100%; height: auto; min-height: 36px; padding-block: 6px; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .actions .btn { height: auto; min-height: 36px; padding-block: 6px; }
  .text-link { display: inline-flex; align-items: center; min-height: 32px; font-weight: 500; }
  .hint code { font: 11.5px ui-monospace, monospace; padding: 0 4px; border-radius: 4px; background: var(--surface-2); }

  /* 清單列：設定首頁、子頁的開關、技能清單 */
  .list-group { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .supported-by { display: block; width: fit-content; margin: 24px auto 8px; opacity: .85; }
  .supported-by:hover { opacity: 1; }
  .supported-by img { display: block; height: 22px; }
  .list-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; width: 100%; min-height: 52px; padding: 10px 14px;
    border: 0; background: none; text-align: left; font-size: 13px;
  }
  .list-row + .list-row { border-top: 1px solid var(--line); }
  label.list-row, .nav-row { cursor: pointer; }
  .nav-row { flex-wrap: nowrap; }
  .nav-row:hover, label.list-row:hover { background: var(--surface-2); }
  .nav-row svg { color: var(--faint); }
  .row-text { flex: 1 1 10em; min-width: 0; }
  .row-text small { display: block; color: var(--faint); font-size: 12px; line-height: 1.45; margin-top: 1px; }
  .btn-sm { height: 30px; padding: 0 12px; font-size: 12.5px; }
  /* 帳號區：身分列（頭像＋名稱＋說明，未登入時下面是兩個登入按鈕）在上，方案列（方案＋升級、用量條、用量與重置日）在下 */
  .list-row.account-id, .list-row.account-plan { display: grid; align-items: stretch; padding: 14px; }
  .list-row.account-id { gap: 14px; }
  .list-row.account-plan { gap: 10px; }
  .id-head { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .id-head .row-text strong { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .id-head .btn { flex: none; }
  .avatar { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); }
  .avatar svg { width: 18px; height: 18px; }
  .avatar-letter { background: var(--accent-soft); color: var(--accent); font-size: 15px; font-weight: 600; }
  .sso { display: grid; gap: 8px; }
  /* Google 登入按鈕規範（developers.google.com/identity/branding-guidelines，2026-10-08 查）：淺色底 #fff、框 #747775、字 #1f1f1f；
     深色底 #131314、框 #8e918f、字 #e3e3e3；左右留 12px、標誌到字 10px；G 只能用原色。GitHub 用同一款：兩個登入方式要一樣醒目 */
  .sso-btn { width: 100%; height: 40px; padding: 0 12px; gap: 10px; font-size: 14px; background: #fff; border-color: #747775; color: #1f1f1f; }
  .sso-btn:hover:not(:disabled) { background: #f4f4f5; }
  .sso-btn svg { width: 18px; height: 18px; flex: none; }
  .plan-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .plan-head strong { font-weight: 600; }
  .account-plan .meter { height: 6px; margin: 2px 0 0; }
  .plan-meta { display: flex; justify-content: space-between; gap: 8px; }
  .plan-meta small { color: var(--faint); font-size: 12px; }
  @media (prefers-color-scheme: dark) {
    .sso-btn { background: #131314; border-color: #8e918f; color: #e3e3e3; }
    .sso-btn:hover:not(:disabled) { background: #1f1f21; }
  }
  .skill-row .row-text strong { display: block; font: 500 12.5px ui-monospace, "SF Mono", Menlo, monospace; }
  .skill-row .row-text small { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .switch {
    appearance: none; flex: none; width: 34px; height: 20px; border-radius: 999px; margin: 0; cursor: pointer;
    background: var(--line-strong); position: relative; transition: background .15s;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s;
  }
  .switch:checked { background: var(--accent); }
  .switch:checked::after { transform: translateX(14px); }

  /* 記憶 */
  .item-list { margin: 0; padding: 0; list-style: none; }
  .memory-row { display: flex; align-items: center; gap: 6px; padding: 6px 0 6px 2px; font-size: 13px; }
  .memory-row + .memory-row { border-top: 1px solid var(--line); }
  .memory-row span { flex: 1; min-width: 0; }
  .memory-row .icon-btn svg { width: 12px; height: 12px; }
  .memory-row .icon-btn:hover { color: var(--err); }
  .skill-empty { color: var(--faint); font-size: 12px; }

  /* 技能頁：新增卡片（貼連結安裝是主要動作，其他來源降成文字按鈕）、安裝前預覽、分組清單 */
  .add-card { gap: 12px; padding: 14px; }
  .add-head { display: grid; gap: 2px; }
  .add-head strong { font-size: 13.5px; font-weight: 600; }
  .add-head small { color: var(--muted); font-size: 12px; line-height: 1.5; }
  /* .page form 的 padding: 0 權重比較高：這裡用 form.input-group 蓋回來 */
  form.input-group, .input-group { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 5px 0 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line-strong); color: var(--faint); transition: border-color .15s, box-shadow .15s; }
  .input-group:focus-within { border-color: var(--accent); box-shadow: var(--ring); background: var(--surface); }
  .input-group > svg { width: 15px; height: 15px; flex: none; }
  .input-group input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; color: var(--fg); font-size: 13px; }
  .input-group input:focus-visible { box-shadow: none; }
  .input-group .btn { flex: none; height: 32px; padding: 0 14px; border-radius: 7px; font-size: 12.5px; }
  .input-group .btn:disabled { opacity: 1; background: var(--line); color: var(--faint); } /* 還沒貼連結：中性灰，不是半透明的主色 */
  .add-card .form-error { margin-top: -6px; }
  .add-card .notice { margin-top: -2px; }
  .source-links { display: flex; flex-wrap: wrap; gap: 2px; margin: -2px -6px -4px; }
  .text-btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border: 0; border-radius: 7px; background: none; color: var(--muted); font-size: 12.5px; font-weight: 500; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .text-btn:hover { background: var(--surface-2); color: var(--fg); }
  .text-btn:focus-visible { outline: none; box-shadow: var(--ring); }
  .text-btn svg { width: 14px; height: 14px; flex: none; }
  .preview-card { gap: 12px; padding: 14px; border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .preview-list { display: grid; }
  .preview-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; }
  .preview-item:first-child { padding-top: 2px; }
  .preview-item + .preview-item { border-top: 1px solid var(--line); }
  label.preview-item { cursor: pointer; }
  .preview-item input { flex: none; margin: 2px 0 0; width: 15px; height: 15px; accent-color: var(--accent); }
  .preview-item strong { display: block; font: 500 12.5px ui-monospace, "SF Mono", Menlo, monospace; }
  .preview-item small { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; margin-top: 3px; color: var(--muted); font-size: 12px; line-height: 1.5; }
  .preview-meta { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 5px; color: var(--faint); font-size: 11.5px; }
  .preview-source { min-width: 0; overflow-wrap: anywhere; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; }
  .preview-skipped { color: var(--faint); font-size: 12px; overflow-wrap: anywhere; }
  .preview-skipped summary { cursor: pointer; width: fit-content; }
  .preview-warn { margin: 0; padding: 9px 11px; border-radius: 8px; background: var(--surface-2); color: var(--muted); font-size: 12px; line-height: 1.55; }
  .badge.warn { background: var(--err-soft); color: var(--err); }
  .skill-group { display: grid; gap: 4px; }
  .group-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 30px; }
  .group-head .group-title { margin: 0; }
  .group-head .text-btn { margin-right: -2px; }
  .skill-group .skill-empty { padding: 0 8px; }
  .group-count { margin-left: 6px; color: var(--faint); font-weight: 500; }

  /* 技能編輯 */
  #skill-form { display: flex; flex-direction: column; gap: 14px; }
  .skill-desc { height: auto; padding: 8px 10px; resize: none; field-sizing: content; min-height: calc(2lh + 18px); max-height: calc(5lh + 18px); line-height: 1.5; }
  .skill-body { height: 260px; padding: 8px 10px; resize: vertical; font: 12.5px/1.55 ui-monospace, "SF Mono", Menlo, monospace; }

  /* 歷史對話 */
  .notice { padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); font-size: 12.5px; }
  .search { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line-strong); color: var(--faint); }
  .search:focus-within { border-color: var(--accent); box-shadow: var(--ring); }
  .search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; height: 100%; }
  .search input:focus-visible { box-shadow: none; }
  #history-list { display: grid; gap: 14px; }
  .chat-group ul { margin: 0; padding: 0; list-style: none; }
  .group-title { margin: 0 0 2px; padding: 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .chat-row { position: relative; display: flex; align-items: flex-start; border-radius: 8px; }
  .chat-row:hover, .chat-row:focus-within { background: var(--surface-2); }
  .chat-row[aria-current]::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--accent); }
  .chat-open {
    flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; min-height: 40px; padding: 9px 4px 9px 10px;
    border: 0; background: none; text-align: left; border-radius: 8px;
  }
  .chat-title { flex: 1 1 9em; min-width: 0; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; line-height: 1.45; }
  .chat-row[aria-current] .chat-title { color: var(--accent); font-weight: 500; }
  .chat-open time { flex: 0 1 auto; min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .menu-wrap { position: relative; flex: none; padding: 4px 4px 0 0; }
  .more-btn { opacity: 0; }
  .chat-row:hover .more-btn, .chat-row:focus-within .more-btn, .menu-wrap[data-open] .more-btn { opacity: 1; }
  @media (hover: none) { .more-btn { opacity: 1; } }
  .menu {
    position: absolute; right: 4px; top: calc(100% + 2px); z-index: 5; min-width: 150px; max-width: min(260px, calc(100vw - 40px));
    padding: 4px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.14);
  }
  .menu.up { top: auto; bottom: calc(100% - 2px); }
  .menu button { display: block; width: 100%; min-height: 34px; padding: 6px 10px; border: 0; border-radius: 7px; background: none; text-align: left; font-size: 13px; }
  .menu button:hover, .menu button:focus-visible { background: var(--surface-2); box-shadow: none; }
  .empty-state { display: grid; justify-items: center; gap: 6px; padding: 40px 12px 10px; text-align: center; color: var(--muted); font-size: 13px; }
  .empty-state strong { color: var(--fg); font-weight: 600; }
  .empty-state .btn { margin-top: 8px; }

  /* 已刪除 · 復原 */
  .toast-wrap { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 30; display: flex; justify-content: center; pointer-events: none; }
  .toast {
    pointer-events: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; max-width: 100%; padding: 6px 6px 6px 14px;
    border-radius: 10px; background: var(--fg); color: var(--bg); box-shadow: 0 8px 24px rgba(0,0,0,.2); font-size: 13px;
  }
  .toast span { min-width: 0; }
  .toast-undo { min-height: 32px; padding: 0 10px; border: 0; border-radius: 7px; background: none; color: var(--accent-soft); font-weight: 600; }
  .toast-undo:hover { background: color-mix(in srgb, var(--bg) 14%, transparent); }

  /* 輸入框的 / 技能選單 */
  #form { position: relative; }
  .slash {
    position: absolute; left: 12px; right: 12px; bottom: calc(100% - 4px); max-height: 240px; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 4px; z-index: 10;
  }
  .slash-item { display: grid; gap: 1px; width: 100%; text-align: left; padding: 6px 9px; border: 0; border-radius: 7px; background: none; }
  .slash-item[aria-selected=true] { background: var(--accent-soft); }
  .slash-item strong { font: 500 12.5px ui-monospace, "SF Mono", Menlo, monospace; color: var(--accent); }
  .slash-item small { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slash-empty { padding: 8px 10px; color: var(--faint); font-size: 12px; }
  .slash-item.command strong { color: var(--fg); }
  .slash-item.command + .slash-item:not(.command) { margin-top: 5px; position: relative; }
  .slash-item.command + .slash-item:not(.command)::before { content: ""; position: absolute; left: 6px; right: 6px; top: -3px; border-top: 1px solid var(--line); }
  /* ---------- 對話裡的卡片：詢問、檔案、確認、記憶、網頁 ---------- */
  .chat-card {
    align-self: stretch; display: grid; gap: 8px; padding: 10px 12px; min-width: 0;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); font-size: 13px;
  }
  .card-title { display: flex; align-items: flex-start; gap: 7px; font-weight: 600; line-height: 1.45; }
  .card-title svg { color: var(--accent); margin-top: 2px; }
  .card-body { white-space: pre-wrap; }
  .card-hint { font-size: 12px; color: var(--faint); }
  .card-foot { font-size: 12.5px; color: var(--muted); }
  .card-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .btn.sm { height: 32px; padding: 0 10px; font-size: 12.5px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .badge { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 600; line-height: 18px; vertical-align: 1px; }

  .ask-options { display: grid; gap: 6px; }
  .ask-opt {
    display: grid; gap: 1px; width: 100%; min-height: 36px; padding: 7px 10px; text-align: left;
    border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface);
  }
  .ask-opt:hover:not(:disabled) { border-color: var(--accent); }
  .ask-opt small { color: var(--muted); font-size: 12px; }
  .ask-opt[aria-pressed=true] { border-color: var(--accent); background: var(--accent-soft); }
  .ask-opt[aria-pressed=true] .ask-label { color: var(--accent); font-weight: 600; }
  .ask-opt.other { border-style: dashed; }
  .ask-opt.other .ask-label { color: var(--muted); }
  .ask-opt:disabled { cursor: default; }
  .ask-card[data-state=answered] .ask-opt[aria-pressed=false] { opacity: .55; }
  .ask-card[data-state=cancelled] .ask-opt { opacity: .55; }
  .ask-card[data-state=waiting] { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }

  .file-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .file-icon { position: relative; flex: none; width: 36px; height: 40px; display: grid; place-items: center; border-radius: 8px; background: var(--accent-soft); color: var(--accent); }
  .file-icon svg { width: 22px; height: 22px; }
  .file-icon b { position: absolute; bottom: 3px; font: 700 8.5px/1 ui-monospace, monospace; text-transform: uppercase; max-width: 32px; overflow: hidden; }
  .file-meta, .page-meta, .memory-text { display: grid; min-width: 0; }
  .file-meta strong, .page-meta strong { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-meta small, .page-meta small, .memory-text small { color: var(--faint); font-size: 12px; }
  .file-card .copy { color: inherit; font-size: 12.5px; gap: 6px; }
  .file-card .copy.done { color: var(--ok); font-size: 0; }
  .file-card .copy.done::after { font-size: 12.5px; }
  .file-preview {
    margin: 0; padding: 8px 10px; max-height: 240px; overflow: auto; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line);
    font: 11.5px/1.5 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; word-break: break-all;
  }

  .confirm-card[data-state=waiting] { border-color: color-mix(in srgb, var(--err) 40%, var(--line)); }
  .confirm-card[data-state=waiting] .card-title svg { color: var(--err); }
  .confirm-card[data-state=denied] .card-foot { color: var(--err); }
  .confirm-card[data-state=allowed] .card-foot { color: var(--ok); }
  .confirm-detail {
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere;
    max-height: 9em; overflow: auto; padding: 6px 8px; border-radius: 6px; background: var(--surface-2);
  }
  .confirm-warn { font-size: 12.5px; color: var(--err); }

  .memory-card, .page-card { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 12px; }
  .memory-card > svg, .page-card > svg { color: var(--accent); }
  .memory-text { flex: 1; }
  .memory-card[data-undone] { opacity: .6; }
  .page-card { width: 100%; min-height: 44px; text-align: left; cursor: pointer; }
  .page-card:hover { border-color: var(--accent); }
  .page-meta { flex: 1; }

  /* ---------- 專案：頂列切換器、清單、專案頁 ---------- */
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  header > .project-switch, .project-switch-wrap { margin-right: auto; min-width: 0; }
  .project-switch-wrap { display: flex; flex: 0 1 auto; }
  .project-switch-wrap .menu-wrap { flex: 0 1 auto; min-width: 0; padding: 0; }
  .project-switch {
    display: flex; align-items: center; gap: 6px; max-width: 100%; height: 32px; padding: 0 8px 0 7px; border: 0; border-radius: 7px;
    background: transparent; color: var(--fg); font-size: 13px; font-weight: 600;
  }
  .project-switch span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .project-switch svg { color: var(--muted); }
  .project-switch:hover:not(:disabled) { background: var(--surface-2); }
  .project-switch:disabled { opacity: .5; }
